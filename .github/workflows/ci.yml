name: CI

on:
  push:
    branches: [master, 'v5/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # 測試目標含 net48，只能在 Windows 上執行；需要資料庫的整合測試另外在 Linux＋容器執行
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      # 依 global.json 安裝 SDK
      - uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore src/Chef.DbAccess/Chef.DbAccess.sln

      - name: Build
        run: dotnet build src/Chef.DbAccess/Chef.DbAccess.sln --configuration Release --no-restore

      - name: Build samples
        run: dotnet build src/Chef.DbAccess.SqlServer.Samples/Chef.DbAccess.SqlServer.Samples.sln --configuration Release

      # 單元測試與 SQL 快照測試；需要資料庫的整合測試與資料快照標記為 Integration，不在這裡執行
      - name: Test
        run: dotnet test src/Chef.DbAccess/Chef.DbAccess.sln --configuration Release --no-build --filter "TestCategory!=Integration"

      # 只產出套件供下載檢查，不發佈；測試專案不會被打包
      - name: Pack
        run: dotnet pack src/Chef.DbAccess/Chef.DbAccess.sln --configuration Release --no-build --output ${{ runner.temp }}/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      # 快照比對失敗時，Verify 會在快照旁寫出 *.received.*，上傳後可以下載比對
      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots
          path: '**/*.received.*'
          if-no-files-found: ignore

  integration-test:
    # 需要資料庫的整合測試與資料快照：以 Testcontainers 啟動 SQL Server 容器並建立測試資料庫。
    # Linux 無法執行 .NET Framework，只跑 net10.0
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CHEF_TEST_SQLSERVER: container
    steps:
      - uses: actions/checkout@v7

      # 依 global.json 安裝 SDK
      - uses: actions/setup-dotnet@v6

      - name: Test
        run: dotnet test src/Chef.DbAccess/Chef.DbAccess.SqlServer.Tests --configuration Release --framework net10.0 --filter "TestCategory=Integration"

      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots-integration
          path: '**/*.received.*'
          if-no-files-found: ignore

  sqlserver-2016-test:
    # 最低支援版本 SQL Server 2016 SP1（§5.16）：Linux 容器最舊只有 2017，所以在 Windows 安裝 2016 SP1 LocalDB，
    # 在相容性層級 100 與 130 下各跑一次整合測試。安裝需要時間，只在 master 的 push、PR 與手動觸發時執行
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compatibility-level: [100, 130]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CHEF_TEST_SQLSERVER: 'Data Source=(localdb)\Chef2016;Integrated Security=True;TrustServerCertificate=True'
      # 微軟官方的 2016 SP1 LocalDB 安裝檔（13.1.4001.0），以 SHA256 確認檔案沒有被換掉
      LOCALDB_URL: https://download.microsoft.com/download/9/0/7/907AD35F-9F9C-43A5-9789-52470555DB90/ENU/SqlLocalDB.msi
      LOCALDB_SHA256: 413E739B79068BA0D91A8C62DB14BCCD37591E86515F4AE74F4C91C270F02D45
    steps:
      - uses: actions/checkout@v7

      # 依 global.json 安裝 SDK
      - uses: actions/setup-dotnet@v6

      # 快取安裝檔：少一次下載，微軟撤掉下載連結時也還能從快取安裝（快取 7 天沒有使用會被清除）
      - name: Cache SQL Server 2016 SP1 LocalDB installer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/localdb-installer
          key: sqllocaldb-2016sp1-${{ env.LOCALDB_SHA256 }}

      # runner 可能已經裝了較新版的 LocalDB，建立執行個體時明確指定 13.0
      - name: Install SQL Server 2016 SP1 LocalDB
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'localdb-installer/SqlLocalDB.msi'
          if (-not (Test-Path $msi)) {
              New-Item -ItemType Directory -Force (Split-Path $msi) | Out-Null
              Invoke-WebRequest $env:LOCALDB_URL -OutFile $msi
          }
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:LOCALDB_SHA256) { throw 'SqlLocalDB.msi 的 SHA256 不符' }

          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart IACCEPTSQLLOCALDBLICENSETERMS=YES" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "安裝 SQL Server 2016 SP1 LocalDB 失敗（結束代碼 $($process.ExitCode)）" }

          sqllocaldb create Chef2016 13.0 -s
          if ($LASTEXITCODE -ne 0) { throw '建立 LocalDB 執行個體失敗' }

          sqlcmd -S '(localdb)\Chef2016' -E -b -Q 'SELECT @@VERSION'

      - name: Create test databases
        shell: pwsh
        run: ./test/setup-localdb.ps1 -Server '(localdb)\Chef2016' -CompatibilityLevel ${{ matrix.compatibility-level }}

      - name: Test
        run: dotnet test src/Chef.DbAccess/Chef.DbAccess.SqlServer.Tests --configuration Release --filter "TestCategory=Integration"

      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots-sqlserver2016-${{ matrix.compatibility-level }}
          path: '**/*.received.*'
          if-no-files-found: ignore

  benchmark-allocations:
    # §10.3：配置數量不受機器影響，與 allocation-baseline.json 比對，增加超過容許誤差（見 compare-allocations.ps1）就失敗。
    # 要跑完所有基準情境，觸發範圍與 2016 相容性測試相同
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      # 依 global.json 安裝 SDK
      - uses: actions/setup-dotnet@v6

      # 與 benchmarks.yml 相同，使用映像檔內建的 LocalDB
      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw '啟動 LocalDB 失敗' }

      # 只看配置數量：BenchmarkDotNet 在量測之後另外跑一輪取得配置數量，量測輪數不影響結果，
      # 所以暖機 3 輪讓快取建好，量測只跑 1 輪，每輪 100 毫秒
      - name: Run benchmarks
        shell: pwsh
        run: dotnet run -c Release -f net10.0 --project src/Chef.DbAccess/Chef.DbAccess.Benchmarks -- --filter '*' --runtimes net10.0 net48 --launchCount 1 --warmupCount 3 --iterationCount 1 --iterationTime 100 --exporters briefjson --artifacts (Join-Path $env:RUNNER_TEMP 'allocations')

      - name: Compare allocations
        shell: pwsh
        run: ./src/Chef.DbAccess/Chef.DbAccess.Benchmarks/compare-allocations.ps1 -Results (Join-Path $env:RUNNER_TEMP 'allocations/results') -Output (Join-Path $env:RUNNER_TEMP 'allocation-baseline.json')

      # 以這次結果產生的基準檔：配置變化符合預期時，下載下來取代 allocation-baseline.json
      - name: Upload allocation baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-baseline
          path: ${{ runner.temp }}/allocation-baseline.json
          if-no-files-found: ignore

      - name: Upload benchmark logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-benchmark-logs
          path: ${{ runner.temp }}/allocations
          if-no-files-found: ignore
